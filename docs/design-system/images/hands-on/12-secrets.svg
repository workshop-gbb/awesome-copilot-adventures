<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">12-secrets concept map</title><desc id="description">Rehearse incident decisions without a real credential. Triage exposure leads to Revoke with owner leads to Verify disposition.</desc><rect width="960" height="420" rx="20" fill="#ffffff"/><rect x="20" y="20" width="920" height="380" rx="14" fill="none" stroke="#bdbdbd"/><path d="M50 70h140" stroke="#111111" stroke-width="5"/><text x="50" y="108" fill="#555555" font-family="system-ui, sans-serif" font-size="18">12-SECRETS</text><g font-family="system-ui, sans-serif"><path d="M170 220 Q325 220 480 220" fill="none" stroke="#777777" stroke-width="3"/><path d="M480 220 Q635 220 790 220" fill="none" stroke="#777777" stroke-width="3"/><g transform="translate(40 172)"><rect width="260" height="96" rx="12" fill="#f5f5f5" stroke="#555555" stroke-width="2"/><circle cx="26" cy="25" r="12" fill="#111111"/><text x="26" y="30" text-anchor="middle" font-size="14" fill="#ffffff">1</text><text x="130" y="64" text-anchor="middle" fill="#111111" font-size="20">Triage exposure</text></g><g transform="translate(350 172)"><rect width="260" height="96" rx="12" fill="#111111" stroke="#555555" stroke-width="2"/><circle cx="26" cy="25" r="12" fill="#ffffff"/><text x="26" y="30" text-anchor="middle" font-size="14" fill="#111111">2</text><text x="130" y="64" text-anchor="middle" fill="#ffffff" font-size="20">Revoke with owner</text></g><g transform="translate(660 172)"><rect width="260" height="96" rx="12" fill="#f5f5f5" stroke="#555555" stroke-width="2"/><circle cx="26" cy="25" r="12" fill="#111111"/><text x="26" y="30" text-anchor="middle" font-size="14" fill="#ffffff">3</text><text x="130" y="64" text-anchor="middle" fill="#111111" font-size="20">Verify disposition</text></g></g><path d="M50 365h860" stroke="#e0e0e0" stroke-width="2"/></svg>
