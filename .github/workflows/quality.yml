name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build solutions/csharp/CopilotAdventures.sln
      - run: dotnet run --project solutions/csharp/CopilotAdventures.csproj -- mythos-test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python solutions/python/test_gridlock_arena.py
      - name: Verify the hands-on modernization reference
        working-directory: mslearn-github-copilot/LabFiles/17-spec-kit-modernization
        env:
          HANDS_ON_REFERENCE: "1"
        run: python -m unittest test_legacy test_modernization -v
