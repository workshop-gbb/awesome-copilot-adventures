title: Awesome Copilot Adventures
description: Evidence-first, fantasy-themed curriculum for agentic software engineering with GitHub Copilot.
url: https://paulasilvatech.github.io
baseurl: /awesome-copilot-adventures
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: true
  focus_shortcut_key: k
heading_anchors: true
permalink: pretty
mermaid:
  version: "11.17.2"
aux_links:
  GitHub repository: https://github.com/paulasilvatech/awesome-copilot-adventures
aux_links_new_tab: true
nav_external_links:
  - title: Open in Codespaces
    url: https://codespaces.new/paulasilvatech/awesome-copilot-adventures?quickstart=1
    hide_icon: false
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/paulasilvatech/awesome-copilot-adventures
gh_edit_branch: main
gh_edit_view_mode: edit
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
relative_links:
  enabled: true
  collections: true
defaults:
  - scope:
      path: docs
    values:
      layout: default
      last_modified_date: 2026-09-05
  - scope:
      path: adventures
    values:
      layout: default
      last_modified_date: 2026-09-05
exclude:
  - README.md
  - NOTICE.md
  - legacy
  - labs
  - solutions
  - node_modules
  - scripts
  - assets/README.md
  - assets/images/adventures/README.md
  - assets/video/README.md
  - shared/README.md
  - package.json
  - package-lock.json
  - AGENTS.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - SUPPORT.md
