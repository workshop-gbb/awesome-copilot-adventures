            - text: Model Context Protocol.
          - listitem [ref=f8e183]:
            - strong [ref=f8e184]: "Evidence:"
            - text: a path, diff, command result, trace, or review decision.
        - heading "Ask → Plan → Agent workflow" [level=2] [ref=f8e185]
        - heading "Ask — investigate" [level=3] [ref=f8e186]
        - list [ref=f8e187]:
          - listitem [ref=f8e188]: Identify the real user outcome and current source of truth.
          - listitem [ref=f8e189]: Inspect relevant files, instructions, tools, permissions, and existing checks.
          - listitem [ref=f8e190]: Cite concrete paths or platform evidence for every important finding.
          - listitem [ref=f8e191]: Record uncertainty and do not infer unavailable capabilities.
        - paragraph [ref=f8e192]:
          - strong [ref=f8e193]: "Gate:"
          - text: No implementation until the current state and evidence are understood.
        - heading "Plan — design" [level=3] [ref=f8e194]
        - list [ref=f8e195]:
          - listitem [ref=f8e196]: State scope, non-goals, assumptions, risks, and trust boundaries.
          - listitem [ref=f8e197]: Select the minimum role, tools, authority, and environment.
          - listitem [ref=f8e198]: Define acceptance criteria, verification commands, review, and reset.
          - listitem [ref=f8e199]: Mark any Preview or experimental dependency and provide a fallback.
        - paragraph [ref=f8e200]:
          - strong [ref=f8e201]: "Gate:"
          - text: Another learner should be able to predict completion from the plan.
        - heading "Agent — execute" [level=3] [ref=f8e202]
        - list [ref=f8e203]:
          - listitem [ref=f8e204]: Make the smallest reversible change or produce the planned artifact.
          - listitem [ref=f8e205]: Use short inspect → change → verify loops.
          - listitem [ref=f8e206]: Preserve command output, exit status, diffs, traces, or platform records.
          - listitem [ref=f8e207]: Stop when acceptance criteria are met; do not perform unrelated cleanup.
        - heading "Review — challenge" [level=3] [ref=f8e208]
        - list [ref=f8e209]:
          - listitem [ref=f8e210]: Inspect the complete diff or artifact.
          - listitem [ref=f8e211]: Compare each result with the plan and acceptance criteria.
          - listitem [ref=f8e212]: Run the narrowest relevant existing check, broadening only when justified.
          - listitem [ref=f8e213]: Record limitations and unresolved risks.
          - listitem [ref=f8e214]:
            - text: Score the work with
            - link "rubric.md" [ref=f8e215] [cursor=pointer]:
              - /url: /awesome-copilot-adventures/en/adventures/03-advanced/lumoria-graph/rubric/
            - text: .
        - heading "Guided mission" [level=2] [ref=f8e216]
        - heading "1. Prepare one isolated copy" [level=3] [ref=f8e217]
        - list [ref=f8e218]:
          - listitem [ref=f8e219]:
            - text: Download and extract the
            - link "lumoria-graph kit" [ref=f8e220] [cursor=pointer]:
              - /url: /awesome-copilot-adventures/assets/lab-kits/adventures/lumoria-graph.zip
            - text: into a new work-drive directory.
          - listitem [ref=f8e221]:
            - text: Read
            - code [ref=f8e222]: KIT-START.md
            - text: at its root. Open
            - code [ref=f8e223]: starter/
            - text: as the VS Code workspace when testing discovery, but run the verifier from the kit root.
          - listitem [ref=f8e224]:
            - text: Inspect
            - code [ref=f8e225]: starter/graph.js
            - text: ","
            - code [ref=f8e226]: verify.js
            - text: before editing.
          - listitem [ref=f8e227]:
            - text: From the extracted kit root, run
            - code [ref=f8e228]: node verify.js
            - text: .
          - listitem [ref=f8e229]: Record the documented starter rejection. A missing runtime or unrelated crash is not the expected exercise result.
        - heading "2. Investigate and plan" [level=3] [ref=f8e230]
        - paragraph [ref=f8e231]: "Copyable baseline command, from the extracted kit root:"
        - generic [ref=f8e232]:
          - code [ref=f8e234]: node verify.js
          - button "Copy code" [ref=f8e235] [cursor=pointer]
          - status
        - paragraph [ref=f8e236]: In Ask, request a trace of the inspected files and what the verifier actually observes. Challenge any claim about live execution that is not supported by output.
        - paragraph [ref=f8e237]: "Use this planning prompt:"
        - generic [ref=f8e238]:
          - code [ref=f8e240]: Specify affectedBy for the provided dependency direction. Include the changed node, visit reverse dependants once, handle cycles and sort the final unique names. Explain an unknown-start error. Do not implement yet. Identify affected files, the negative case and a safe reset.
          - button "Copy code" [ref=f8e241] [cursor=pointer]
          - status
        - heading "3. Implement the reviewed slice" [level=3] [ref=f8e242]
        - list [ref=f8e243]:
          - listitem [ref=f8e244]: Approve only the named starter artifact and necessary focused tests.
          - listitem [ref=f8e245]: Ask Agent to implement one slice; inspect proposed commands before execution.
          - listitem [ref=f8e246]:
            - text: Run
            - code [ref=f8e247]: node verify.js
            - text: again from the kit root, or
            - code [ref=f8e248]: node ../verify.js
            - text: from
            - code [ref=f8e249]: starter/
            - text: .
          - listitem [ref=f8e250]: Compare the exact result with the checkpoint below and review the complete diff.
          - listitem [ref=f8e251]: Record host discovery or live activity separately when available. Do not enable extra services to manufacture a passing result.
        - blockquote [ref=f8e252]:
          - strong [ref=f8e253]: Important
          - paragraph [ref=f8e254]:
            - strong [ref=f8e255]: "Checkpoint:"
            - text: Changing types reaches all five supplied nodes; changing api reaches api and docs only. The fixture validates traversal, not automatic discovery of every real repository dependency.
        - heading "4. Prove a check can reject a mistake" [level=3] [ref=f8e256]
        - paragraph [ref=f8e257]: Reverse the traversal direction deliberately in the disposable implementation. Confirm the types impact case detects the mistake, then restore it.
        - table [ref=f8e258]:
          - rowgroup [ref=f8e259]:
            - row [ref=f8e260]:
              - columnheader "Observation" [ref=f8e261]
              - columnheader "Decision" [ref=f8e262]
              - columnheader "Action" [ref=f8e263]
              - columnheader "Evidence" [ref=f8e264]
              - columnheader "Limitation" [ref=f8e265]
          - rowgroup [ref=f8e266]:
            - row [ref=f8e267]:
              - cell "Initial state and exact diagnostic" [ref=f8e268]
              - cell "Why this change is needed" [ref=f8e269]
              - cell "Named file and bounded change" [ref=f8e270]
              - cell "Command, exit code and observed result" [ref=f8e271]
              - cell "What the local check does not prove" [ref=f8e272]
        - paragraph [ref=f8e273]:
          - text: Finish with the adventure-specific capability evidence in
          - link "the rubric" [ref=f8e274] [cursor=pointer]:
            - /url: /awesome-copilot-adventures/en/adventures/03-advanced/lumoria-graph/rubric/
          - text: ", not just the presence of a file."
        - 'heading "Intentional failure: The Decorative Constellation" [level=2] [ref=f8e275]'
        - paragraph [ref=f8e276]: "Perform this only in a disposable environment:"
        - paragraph [ref=f8e277]: Draw relationships from filenames and assumptions without reading sources. Unsupported edges create false confidence and an incorrect change plan.
        - heading "Recovery" [level=3] [ref=f8e278]
        - paragraph [ref=f8e279]: Return to Ask, identify the violated boundary, narrow the plan, remove unnecessary authority or context, and repeat the smallest relevant verification. Document the causal lesson rather than merely stating that the attempt failed.
        - heading "Independent challenge" [level=2] [ref=f8e280]
        - paragraph [ref=f8e281]: Model a feature crossing source, configuration, tests, and an external API, including confidence and verification for every edge.
        - paragraph [ref=f8e282]: "Constraints:"
        - list [ref=f8e283]:
          - listitem [ref=f8e284]: Do not copy the guided mission verbatim.
          - listitem [ref=f8e285]: Do not add tools, permissions, or cloud resources without a stated need.
          - listitem [ref=f8e286]: Do not claim quality, performance, compatibility, or availability without executed evidence.
          - listitem [ref=f8e287]: Keep fantasy language subordinate to technical clarity.
