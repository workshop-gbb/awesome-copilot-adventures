        - paragraph [ref=f8e156]:
          - strong [ref=f8e157]: "Evidence boundary:"
          - text: The fixture validates traversal, not automatic discovery of every real repository dependency.
        - paragraph [ref=f8e158]: "Estimated session: 45–75 minutes after prerequisites; actual duration varies. Never use production secrets or customer data."
        - heading "Concept explanation" [level=2] [ref=f8e159]
        - paragraph [ref=f8e160]: A repository knowledge graph models files, symbols, tests, services, owners, and requirements with typed edges. Imports are not runtime calls, and co-location is not ownership. Graphs help only when bounded, current, and source-anchored. Generated relationships can become stale, so planning decisions must be confirmed against current files and executable checks.
        - heading "Concrete use case" [level=3] [ref=f8e161]
        - paragraph [ref=f8e162]: If api depends on core and core depends on types, a change to types can affect api. A change to api does not automatically affect its dependency types.
        - heading "Vocabulary checkpoint" [level=3] [ref=f8e163]
        - list [ref=f8e164]:
          - listitem [ref=f8e165]:
            - strong [ref=f8e166]: "Role:"
            - text: Ask, Plan, Agent, or a custom agent.
          - listitem [ref=f8e167]:
            - strong [ref=f8e168]: "Harness/surface:"
            - text: the runtime or product surface in which a role operates.
          - listitem [ref=f8e169]:
