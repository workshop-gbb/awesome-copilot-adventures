            - text: the selected session destination, such as Local, Copilot, or Cloud where exposed.
          - listitem [ref=f8e171]:
            - strong [ref=f8e172]: "Environment:"
            - text: the folder, worktree, local machine, Codespace, or remote environment.
          - listitem [ref=f8e173]:
            - strong [ref=f8e174]: "Instructions:"
            - text: automatically applied durable context.
          - listitem [ref=f8e175]:
            - strong [ref=f8e176]: "Prompt:"
            - text: a manually invoked task template.
          - listitem [ref=f8e177]:
            - strong [ref=f8e178]: "Skill:"
            - text: reusable expertise loaded when relevant.
